services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env - see .env.example}
    volumes:
      - moodtracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d moodtracker']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: moodtracker-app
    restart: unless-stopped
    depends_on:
      db:
        # Not just "container started" - waits for db's own healthcheck above,
        # so the app doesn't race Postgres's startup on a cold `docker compose up`.
        condition: service_healthy
    ports:
      - '${APP_PORT:-80}:8080'
    environment:
      DB_URL: jdbc:postgresql://db:5432/moodtracker
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env - see .env.example}
      SPRING_PROFILES_ACTIVE: prod
      # Optional SMTP relay for password-reset email - see README's "Forgot
      # password". Left blank by default; the app runs fine without it.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@moodtracker.local}

volumes:
  moodtracker-db-data:
