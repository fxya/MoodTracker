plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'com.github.node-gradle.node' version '7.1.0'
}

import com.github.gradle.node.npm.task.NpmTask

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient' // TestRestTemplate
    testImplementation 'org.springframework.boot:spring-boot-restclient' // RestTemplateBuilder, needed by TestRestTemplate
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Google Java Style Guide, enforced via google-java-format. `spotlessCheck` runs
// as part of `check`; `spotlessApply` reformats in place.
spotless {
    java {
        googleJavaFormat()
        target 'src/**/*.java'
    }
}

// Compiles frontend/ (Tailwind CSS + JS, see package.json/vite.config.js) into
// src/main/resources/static, so `bootJar`/`bootRun`/`test`/`build` always run
// against fresh frontend output without a separate manual `npm run build` step.
node {
    version = '22.11.0'
    download = true // no host Node install required, matching how ./gradlew self-bootstraps Gradle
    npmInstallCommand = 'ci'
}

tasks.register('npmBuild', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.files('package.json', 'package-lock.json')
    inputs.dir('frontend')
    outputs.dir('src/main/resources/static/css')
    outputs.dir('src/main/resources/static/js')
    outputs.file('src/main/resources/static/manifest.webmanifest')
    outputs.file('src/main/resources/static/service-worker.js')
    outputs.file('src/main/resources/static/apple-touch-icon.png')
    outputs.dir('src/main/resources/static/icons')
}

tasks.named('processResources') {
    dependsOn tasks.named('npmBuild')
}

// Spotless scans the whole src/**/*.java glob for its Java target, which
// overlaps directory-wise with npmBuild's output under src/main/resources/
// static - no real dependency between them, just an ordering hint so Gradle
// doesn't flag it as an implicit/undeclared one.
tasks.matching { it.name.startsWith('spotless') }.configureEach {
    mustRunAfter tasks.named('npmBuild')
}
