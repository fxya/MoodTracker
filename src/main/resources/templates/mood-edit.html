<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <title>Edit Mood</title>
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#6b7f3f"/>
    <script type="module" th:src="@{/js/register-sw.js}"></script>
    <script type="module" th:src="@{/js/prevent-double-submit.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">
    <div class="mx-auto max-w-xl px-4 py-10">
        <div th:replace="~{fragments/header :: backHeader}"></div>

        <h1 class="mb-6 font-display text-2xl text-ink">Edit Mood</h1>

        <form th:action="@{/moodtracker/{id}/edit(id=${mood.id})}" th:object="${mood}" method="post"
              class="rounded-2xl border border-border-soft bg-surface p-6 shadow-sm">
            <div class="mb-4">
                <label for="mood-text" class="mb-1.5 block text-xs font-semibold text-ink-muted">Mood:</label>
                <input type="text" id="mood-text" th:field="*{mood}" required
                       class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
            </div>
            <div class="mb-4">
                <label for="mood-rating" class="mb-1.5 block text-xs font-semibold text-ink-muted">Rating (1-10):</label>
                <input type="number" id="mood-rating" th:field="*{moodRating}" min="1" max="10" required
                       class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
            </div>
            <div class="mb-4">
                <label for="mood-tag" class="mb-1.5 block text-xs font-semibold text-ink-muted">Tag (optional):</label>
                <select id="mood-tag" th:field="*{moodTag}"
                        class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft">
                    <option value="">No tag</option>
                    <option value="Happy">Happy</option>
                    <option value="Sad">Sad</option>
                    <option value="Anxious">Anxious</option>
                    <option value="Calm">Calm</option>
                    <option value="Excited">Excited</option>
                    <option value="Angry">Angry</option>
                    <option value="Tired">Tired</option>
                    <option value="Content">Content</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="notes" class="mb-1.5 block text-xs font-semibold text-ink-muted">Notes:</label>
                <textarea id="notes" th:field="*{notes}" rows="3"
                          class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"></textarea>
            </div>
            <p class="mb-2 text-xs font-semibold text-ink-muted">Weather (optional correction):</p>
            <div class="mb-4 grid grid-cols-2 gap-3">
                <div>
                    <label for="temperature-c" class="mb-1.5 block text-xs text-ink-faint">Temperature (°C):</label>
                    <input type="number" id="temperature-c" name="temperatureC" step="0.1"
                           th:value="${mood.weather != null ? mood.weather.temperatureC : null}"
                           class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
                </div>
                <div>
                    <label for="precipitation-mm" class="mb-1.5 block text-xs text-ink-faint">Precipitation (mm):</label>
                    <input type="number" id="precipitation-mm" name="precipitationMm" step="0.1" min="0"
                           th:value="${mood.weather != null ? mood.weather.precipitationMm : null}"
                           class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
                </div>
            </div>
            <p class="mb-5 text-xs text-ink-faint">Leave blank to keep the recorded value unchanged.</p>
            <div class="flex gap-3">
                <button type="submit" class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-deep">Save Changes</button>
                <a class="rounded-lg border border-border bg-surface px-4 py-2 text-sm font-semibold text-ink-muted transition-colors hover:bg-surface-alt hover:text-ink" th:href="@{/moodtracker}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
