<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mood Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#6b7f3f"/>
    <script type="module" th:src="@{/js/register-sw.js}"></script>
    <script type="module" th:src="@{/js/prevent-double-submit.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="flex min-h-screen items-center justify-center bg-bg p-6 font-sans text-ink antialiased">
    <div class="w-full max-w-md rounded-2xl border border-border-soft bg-surface p-8 text-center shadow-sm">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-surface-alt text-2xl" aria-hidden="true">🙂</div>
        <h1 class="font-display text-3xl text-ink">Mood Tracker</h1>
        <p class="mt-2 mb-6 text-sm text-ink-muted">Track how you feel, day by day, and notice the patterns.</p>
        <div class="flex flex-wrap justify-center gap-3">
            <a class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-deep" href="/login">Login</a>
            <a class="rounded-lg border border-border bg-surface px-4 py-2 text-sm font-semibold text-ink-muted transition-colors hover:bg-surface-alt hover:text-ink" href="/register">Register</a>
        </div>
    </div>
</body>
</html>
