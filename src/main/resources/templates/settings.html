<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <title>Settings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>Hi, <strong sec:authentication="name">User</strong>!</span>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/moodtracker}">Back to Mood Tracker</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-secondary">Logout</button>
                </form>
            </div>
        </div>

        <h1>Settings</h1>

        <div class="alert alert-success" th:if="${settingsSaved}">Settings saved.</div>

        <form th:action="@{/settings}" method="post">
            <div>
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" th:value="${location}" placeholder="e.g. London, UK"/>
            </div>
            <p class="hero-tagline">
                Used to look up the weather whenever you log a mood. Leave blank to skip weather tracking.
            </p>
            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</body>
</html>
