<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
  <title>All Moods</title>
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <meta name="theme-color" content="#6b7f3f"/>
  <script type="module" th:src="@{/js/register-sw.js}"></script>
  <script type="module" th:src="@{/js/prevent-double-submit.js}"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="min-h-screen bg-bg font-sans text-ink antialiased">
<div class="mx-auto max-w-3xl px-4 py-10">
  <div th:replace="~{fragments/header :: backHeader}"></div>

  <h1 class="mb-6 font-display text-2xl text-ink">All Saved Moods</h1>

  <div class="mb-4 overflow-x-auto rounded-2xl border border-border-soft bg-surface shadow-sm">
    <table id="allMoodsTable" class="w-full border-collapse text-sm">
      <thead>
      <tr class="border-b border-border-soft text-left text-xs text-ink-muted">
        <th class="px-4 py-3 font-semibold">Date</th>
        <th class="px-4 py-3 font-semibold">Rating</th>
        <th class="px-4 py-3 font-semibold">Mood</th>
      </tr>
      </thead>
      <tbody>
      <!-- Content will be populated by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Hidden by default, shown by moods.js once it knows there's more than one page -
       matches the /moodtracker pagination's look, but uses disabled (not hidden)
       Previous/Next buttons at the boundaries, since this re-renders in place
       rather than navigating to a new URL. -->
  <div class="mb-8 flex items-center justify-center gap-4 text-sm text-ink-muted" id="allMoodsPagination" data-testid="pagination" style="display: none;">
    <button type="button" id="allMoodsPrev" class="rounded-lg border border-border bg-surface px-3 py-1.5 text-xs font-semibold text-ink-muted transition-colors hover:bg-surface-alt hover:text-ink disabled:cursor-not-allowed disabled:opacity-50">Previous</button>
    <span data-testid="pagination-status" id="allMoodsPaginationStatus" aria-live="polite">Page 1 of 1</span>
    <button type="button" id="allMoodsNext" class="rounded-lg border border-border bg-surface px-3 py-1.5 text-xs font-semibold text-ink-muted transition-colors hover:bg-surface-alt hover:text-ink disabled:cursor-not-allowed disabled:opacity-50">Next</button>
  </div>

  <h2 class="mb-4 font-display text-lg text-ink">Mood Trend</h2>
  <div class="relative mb-8 rounded-2xl border border-border-soft bg-surface p-4 shadow-sm">
    <canvas id="moodTrendChart"></canvas>
  </div>

  <div class="mb-8 rounded-2xl border border-dashed border-border px-6 py-10 text-center text-sm text-ink-muted" id="weatherEmptyState" style="display: none;">
    <p>No weather data recorded yet. Set a location in <a class="font-semibold text-accent hover:text-accent-deep" href="/settings">Settings</a> to start tracking weather with your moods.</p>
  </div>

  <div id="temperatureSection">
    <h2 class="mb-4 font-display text-lg text-ink">Temperature Trend</h2>
    <div class="relative mb-8 rounded-2xl border border-border-soft bg-surface p-4 shadow-sm">
      <canvas id="temperatureChart"></canvas>
    </div>
  </div>

  <div id="precipitationSection">
    <h2 class="mb-4 font-display text-lg text-ink">Precipitation Trend</h2>
    <div class="relative mb-8 rounded-2xl border border-border-soft bg-surface p-4 shadow-sm">
      <canvas id="precipitationChart"></canvas>
    </div>
  </div>

  <div id="correlationSection">
    <h2 class="mb-4 font-display text-lg text-ink">Mood by Weather</h2>
    <p class="mb-4 text-sm text-ink-faint" id="correlationCaption"></p>
    <div class="relative mb-8 rounded-2xl border border-border-soft bg-surface p-4 shadow-sm">
      <canvas id="correlationChart"></canvas>
    </div>
  </div>

  <div id="heatmapSection">
    <h2 class="mb-4 font-display text-lg text-ink">Mood Calendar</h2>
    <div class="mb-8 overflow-x-auto rounded-2xl border border-border-soft bg-surface p-4 shadow-sm">
      <div id="heatmapGrid" class="inline-grid gap-1"></div>
      <div class="mt-3 flex items-center gap-2 text-xs text-ink-faint">
        <span>Lower</span>
        <span class="h-3 w-3 rounded-sm bg-rating-low"></span>
        <span class="h-3 w-3 rounded-sm bg-rating-mid"></span>
        <span class="h-3 w-3 rounded-sm bg-rating-high"></span>
        <span>Higher</span>
        <span class="ml-2 h-3 w-3 rounded-sm bg-surface-alt"></span>
        <span>No entry</span>
      </div>
    </div>
  </div>

</div>
</body>
<script type="module" th:src="@{/js/moods.js}"></script>
</html>
