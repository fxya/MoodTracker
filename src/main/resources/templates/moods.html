<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
  <title>All Moods</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="/js/vendor/chart.umd.min.js"></script>
</head>
<body>
<div class="container container-wide">
  <h1>All Saved Moods</h1>
  <table>
    <thead>
    <tr>
      <th>Date</th>
      <th>Rating</th>
      <th>Mood</th>
    </tr>
    </thead>
    <tbody>
    <!-- Content will be populated by JavaScript -->
    </tbody>
  </table>
  <h2>Mood Trend</h2>
  <div class="chart-wrap">
    <canvas id="moodTrendChart"></canvas>
  </div>

  <div class="empty-state" id="weatherEmptyState" style="display: none;">
    <p>No weather data recorded yet. Set a location in <a href="/settings">Settings</a> to start tracking weather with your moods.</p>
  </div>

  <div id="temperatureSection">
    <h2>Temperature Trend</h2>
    <div class="chart-wrap">
      <canvas id="temperatureChart"></canvas>
    </div>
  </div>

  <div id="precipitationSection">
    <h2>Precipitation Trend</h2>
    <div class="chart-wrap">
      <canvas id="precipitationChart"></canvas>
    </div>
  </div>

  <div id="correlationSection">
    <h2>Mood by Weather</h2>
    <p class="hero-tagline" id="correlationCaption"></p>
    <div class="chart-wrap">
      <canvas id="correlationChart"></canvas>
    </div>
  </div>

  <div><a class="btn btn-secondary" href="/moodtracker">Return</a></div>
</div>
</body>
<script src="/js/moods.js"></script>
</html>
