<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <title>Mood Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>Hi, <strong sec:authentication="name">User</strong>!</span>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/settings}">Settings</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-secondary">Logout</button>
                </form>
            </div>
        </div>

        <h1>Mood Tracker</h1>

        <h2>Add New Mood</h2>
        <form th:action="@{/moodtracker/add}" th:object="${newMood}" method="post">
            <div>
                <label for="mood-text">Mood:</label>
                <input type="text" id="mood-text" th:field="*{mood}" required/>
            </div>
            <div>
                <label for="mood-rating">Rating (1-10):</label>
                <input type="number" id="mood-rating" th:field="*{moodRating}" min="1" max="10" required/>
            </div>
            <div>
                <label for="notes">Notes:</label>
                <textarea id="notes" th:field="*{notes}" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Mood</button>
        </form>

        <h2>Your Moods</h2>
        <div class="empty-state" th:if="${#lists.isEmpty(moods)}">
            <p>You haven't recorded any moods yet. Add your first one above!</p>
        </div>
        <ul th:unless="${#lists.isEmpty(moods)}">
            <li class="mood-card" th:each="mood : ${moods}">
                <div class="mood-card-header">
                    <span class="mood-date" th:text="${#temporals.format(mood.date, 'dd-MMM-yyyy HH:mm')}">Date</span>
                    <span class="rating-badge"
                          th:classappend="${mood.moodRating <= 3} ? 'rating-low' : (${mood.moodRating <= 6} ? 'rating-mid' : 'rating-high')"
                          th:text="${mood.moodRating} + '/10'">Rating</span>
                </div>
                <p class="mood-text" th:text="${mood.mood}">Mood Text</p>
                <p class="mood-notes" th:if="${mood.notes != null && !mood.notes.isEmpty()}" th:text="${mood.notes}">Notes</p>
            </li>
        </ul>
    </div>
</body>
</html>
