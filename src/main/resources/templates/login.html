<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="centered-page">
    <div class="container">
        <div class="brand-mark" aria-hidden="true">🙂</div>
        <h1>Login</h1>
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${param.accountDeleted}" class="alert alert-success">
                Your account has been deleted.
            </div>
            <div th:if="${registrationSuccess}" class="alert alert-success" th:text="${registrationSuccess}">
                Registration successful! Please login.
            </div>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Log in</button>
            </div>
        </form>
        <p class="auth-footer">No account? <a th:href="@{/register}">Register here</a></p>
    </div>
</body>
</html>
