<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#6b7f3f"/>
    <script type="module" src="/js/register-sw.js"></script>
    <script type="module" src="/js/prevent-double-submit.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="flex min-h-screen items-center justify-center bg-bg p-6 font-sans text-ink antialiased">
    <div class="w-full max-w-md rounded-2xl border border-border-soft bg-surface p-8 shadow-sm">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-surface-alt text-2xl" aria-hidden="true">🔑</div>
        <h1 class="mb-2 text-center font-display text-2xl text-ink">Forgot Password</h1>
        <p class="mb-6 text-center text-sm text-ink-muted">Enter your username and we'll email you a reset link, if your account has an email on file.</p>
        <div th:if="${requestMessage}" class="mb-4 rounded-lg border border-success-border bg-success-bg px-4 py-2.5 text-sm text-success" data-testid="alert-success" th:text="${requestMessage}">Request sent</div>
        <div th:if="${requestError}" class="mb-4 rounded-lg border border-danger-border bg-danger-bg px-4 py-2.5 text-sm text-danger" data-testid="alert-danger" th:text="${requestError}">Request error</div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-5">
                <label for="username" class="mb-1.5 block text-xs font-semibold text-ink-muted">Username:</label>
                <input type="text" id="username" name="username" required autofocus
                       class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
            </div>
            <div>
                <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-deep">Send reset link</button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-ink-muted"><a class="font-semibold text-accent hover:text-accent-deep" th:href="@{/login}">Back to login</a></p>
    </div>
</body>
</html>
