<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#6b7f3f"/>
    <script type="module" th:src="@{/js/register-sw.js}"></script>
    <script type="module" th:src="@{/js/prevent-double-submit.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="flex min-h-screen items-center justify-center bg-bg p-6 font-sans text-ink antialiased">
    <div class="w-full max-w-md rounded-2xl border border-border-soft bg-surface p-8 shadow-sm">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-surface-alt text-2xl" aria-hidden="true">🔑</div>
        <h1 class="mb-6 text-center font-display text-2xl text-ink">Reset Password</h1>

        <div th:if="${!tokenValid}">
            <div class="mb-4 rounded-lg border border-danger-border bg-danger-bg px-4 py-2.5 text-sm text-danger" data-testid="alert-danger">
                This reset link is invalid or has expired.
            </div>
            <p class="text-center text-sm text-ink-muted"><a class="font-semibold text-accent hover:text-accent-deep" th:href="@{/forgot-password}">Request a new link</a></p>
        </div>

        <div th:if="${tokenValid}">
            <div th:if="${resetError}" class="mb-4 rounded-lg border border-danger-border bg-danger-bg px-4 py-2.5 text-sm text-danger" data-testid="alert-danger" th:text="${resetError}">Reset error</div>
            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>
                <div class="mb-4">
                    <label for="new-password" class="mb-1.5 block text-xs font-semibold text-ink-muted">New password:</label>
                    <input type="password" id="new-password" name="newPassword" required autofocus
                           class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
                </div>
                <div class="mb-5">
                    <label for="confirm-password" class="mb-1.5 block text-xs font-semibold text-ink-muted">Confirm new password:</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required
                           class="w-full rounded-lg border border-border bg-bg px-3 py-2 text-sm text-ink focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft"/>
                </div>
                <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-deep">Reset password</button>
            </form>
        </div>
    </div>
</body>
</html>
