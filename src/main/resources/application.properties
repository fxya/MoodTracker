spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moodtracker}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_postgres_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# SMTP relay for the "forgot password" reset email - all blank/default until set,
# so the app still boots with none of these configured (sending will fail at
# send-time, handled gracefully by PasswordResetController). Point these at any
# SMTP provider (e.g. a Gmail app password) when deploying somewhere real.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@moodtracker.local}

# Only the health endpoint is exposed - no metrics/env/beans/etc - and with no
# detail (just {"status":"UP"}), since it's reachable without authentication
# (see WebSecurityConfig) for external checks against the running instance.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# The mail health indicator would otherwise try to connect to spring.mail.host on
# every health check and report DOWN whenever SMTP isn't configured - but an
# unconfigured mail relay isn't an outage, forgot-password just degrades
# gracefully (see PasswordResetController). Liveness shouldn't depend on it.
management.health.mail.enabled=false

# "dev" is active unless overridden (e.g. SPRING_PROFILES_ACTIVE=prod), so local
# ./gradlew bootRun keeps working with no setup - see DataInitializer, which only
# seeds the testuser/password demo account under the dev profile.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Content-hashed, far-future-cacheable URLs for CSS/JS, resolved transparently
# server-side (same on-disk file, no Vite/build changes) and rewritten
# automatically wherever a template uses th:href/th:src - see vite.config.js's
# comment on why build output filenames themselves aren't hashed. The
# service worker's STATIC_ASSETS precache list (frontend/public/service-worker.js)
# deliberately excludes /css/** and /js/** for this reason - it can't know the
# hashed URLs ahead of time, so it caches them lazily on first request instead.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# CSV import (SettingsController.importMoods) - the first file upload in the
# app. Spring Boot's un-overridden defaults (1MB/10MB) are plenty for a CSV
# of mood text, but 1MB caps out fast for a large multi-year history, so this
# raises both explicitly rather than leaving it to chance.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Per-IP limit on POST /login, /register, /forgot-password (AuthRateLimitFilter) -
# defaults preserve the existing 20-attempts/5-minute production behavior.
# Overridden much higher for the Playwright e2e suite (see playwright.config.js's
# webServer.env), whose own register/login volume at full parallelism would
# otherwise trip this and fail tests with unrelated 429s.
app.auth-rate-limit.max-attempts=${APP_AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
app.auth-rate-limit.window-minutes=${APP_AUTH_RATE_LIMIT_WINDOW_MINUTES:5}
