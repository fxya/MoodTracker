name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  backend:
    name: Java (Gradle)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Matches the checked-in defaults in application.properties (DB_URL/
          # DB_USERNAME/DB_PASSWORD) - no secrets or extra env vars needed for
          # ./gradlew to find this database, same as local dev.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_postgres_password
          POSTGRES_DB: moodtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Runs the full check lifecycle: compiles, runs the JUnit suite against
      # the Postgres service above, and spotlessCheck (as documented in
      # README.md's "Code style" section). This also exercises the frontend
      # build (npmBuild, wired into processResources - see build.gradle),
      # downloading a pinned Node version with no host install required.
      - name: ./gradlew build
        run: ./gradlew build

  frontend:
    name: JS (Vitest + Prettier)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run format:check
